<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat — Recepcionista</title><link rel="stylesheet" href="/static/styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><div class="accent-bar"></div>
<header class="top"><div class="brand"><span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFF8EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1L3 20l1-5.1A8.5 8.5 0 1 1 21 11.5Z"/></svg></span><span>Recepcionista</span></div>
<nav class="tabs" aria-label="Principal">
<a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M9 20v-6h6v6"/></svg><span>Locales</span></a>
<a href="/chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1L3 20l1-5.1A8.5 8.5 0 1 1 21 11.5Z"/></svg><span>Chat</span></a>
<a href="/panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 9h6M3 15h6"/></svg><span>Panel</span></a>
<a href="/cocina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-6.5 0-4-3.5-5.5-3.5-9.5-2.5 1-3.5 3-3.7 5C10.5 9.5 9 8 9 5.5 6 7.5 5 10.5 5 15.5 5 19.3 8 22 12 22Z"/></svg><span>Cocina</span></a>
<a href="/menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Carta</span></a>
</nav>
<select id="tenant" aria-label="Local" style="max-width:190px"><option value="faro">El Faro</option><option value="brasa">Brasa Viva</option><option value="juana">Doña Juana</option></select>
<input id="customer" aria-label="Tu nombre" style="max-width:130px" value="Cliente" maxlength="24"></header>
<div class="wrap narrow">
<div class="phone ticked"><div class="phone-head"><span class="av" id="av">F</span><div><div id="nm" style="font-weight:600">El Faro</div><div class="presence">en línea · sandbox</div></div></div>
<div id="log" aria-live="polite"></div>
<form class="composer" onsubmit="send();return false"><input id="msg" placeholder="Escribe: menu · 2 ceviche · confirmar" autocomplete="off" aria-label="Mensaje"><button type="submit" id="sendbtn" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></form></div>
<div class="panel ticked" id="paybox" style="display:none;margin-top:14px"></div>
</div>
<script>
const q=new URLSearchParams(location.search);let tenant=q.get('tenant')||'faro';let cart=[];let lastOrder=null;let busy=false;let direccion='';
document.getElementById('tenant').value=tenant;
const NAMES={faro:['F','El Faro'],brasa:['B','Brasa Viva'],juana:['J','Doña Juana']};
function syncHead(){document.getElementById('av').textContent=NAMES[tenant][0];document.getElementById('nm').textContent=NAMES[tenant][1];}
syncHead();
function stamp(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){return esc(s).replace(/`([^`]+)`/g,'<code style="background:rgba(228,87,46,.1);border:1px solid rgba(228,87,46,.3);border-radius:3px;padding:0 5px;font-family:var(--mono);font-size:.82em">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<b>$1</b>');}
function add(who,text){const d=document.createElement('div');d.className='bubble '+(who==='me'?'b-out':'b-in');d.innerHTML=md(text);const s=document.createElement('span');s.className='t';s.textContent=stamp();d.appendChild(s);const log=document.getElementById('log');log.appendChild(d);log.scrollTop=log.scrollHeight;}
function typing(on){let t=document.getElementById('typing');if(on&&!t){t=document.createElement('div');t.id='typing';t.className='bubble b-in';t.textContent='escribiendo…';document.getElementById('log').appendChild(t);}if(!on&&t)t.remove();}
async function send(){
 if(busy)return;const inp=document.getElementById('msg');const text=(inp.value||'menu').trim();if(!text)return;inp.value='';
 const customer=(document.getElementById('customer').value||'Cliente').trim()||'Cliente';
 tenant=document.getElementById('tenant').value;syncHead();add('me',text);typing(true);busy=true;
 const bb=document.getElementById('sendbtn');bb.disabled=true;
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant,customer,message:text,cart})});
 if(!r.ok)throw 0;const j=await r.json();cart=j.cart||cart;if(typeof j.direccion==='string'&&j.direccion)direccion=j.direccion;typing(false);if(j.foto)addFoto(j.foto);add('bot',j.reply);if(j.next==='pago')showPay();}
 catch(e){typing(false);add('bot','Se cortó la conexión con el servidor. Revisa que siga corriendo y reintenta.');}
 busy=false;bb.disabled=false;inp.focus();
}
function addFoto(src){const d=document.createElement('div');d.className='bubble b-in foto';const im=document.createElement('img');im.src=src;im.alt='foto del plato';im.onerror=()=>d.remove();d.appendChild(im);const log=document.getElementById('log');log.appendChild(d);log.scrollTop=log.scrollHeight;}
let PAYCFG=null;
async function payConfig(){if(!PAYCFG){try{PAYCFG=await(await fetch('/api/payments/config?tenant='+tenant)).json();}catch(e){PAYCFG={culqi_pk:'',yape_qr:''};}}return PAYCFG;}
async function showPay(){
 if(!cart.length){add('bot','Carrito vacío: creo un pedido demo para probar el pago.');cart=[{id:tenant==='faro'?'f1':tenant==='brasa'?'b2':'j1',cant:1}];}
 const customer=(document.getElementById('customer').value||'Cliente').trim()||'Cliente';
 const cfg=await payConfig();
 const ro=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant,cliente:customer,items:cart.map(c=>({id:c.id,cant:c.cant})),direccion:direccion||'Sin dirección'})});
 lastOrder=await ro.json();
 const rl=await fetch('/api/payments/culqi/link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant,order_id:lastOrder.id})});
 const link=await rl.json();
 const pb=document.getElementById('paybox');pb.style.display='block';
 pb.innerHTML=`<div class="term-bar" style="margin:-18px -18px 0;border:0;border-bottom:1px solid var(--line)"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="mono muted">cobro ${lastOrder.id} · <span class="num">S/${lastOrder.total.toFixed(2)}</span> · a ${esc(direccion||'sin dirección')}</span></div>
 <div style="padding-top:14px"><span class="badge hot">ref <b>${link.reference_id}</b></span> <span class="badge">comisión <b class="num">S/${link.comision_est.toFixed(2)}</b></span>
 <div class="yape-qr"><div id="yapeqr"></div><div style="flex:1;min-width:150px"><b>Yape QR del local</b><div class="mono muted" style="font-size:.75rem">código ${esc(cfg.yape_qr||'-')} · monto exacto <b class="num">S/${lastOrder.total.toFixed(2)}</b></div><p class="muted" style="font-size:.75rem;margin-top:6px">QR demo escaneable: solo pasa a cocina el monto EXACTO verificado por el servidor. La foto del voucher nunca basta.</p></div></div>
 <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${cfg.culqi_pk?`<button onclick="payCulqiReal(this)">Pagar con tarjeta · Culqi sandbox</button>`:''}<button class="btn-ghost" onclick="payCulqi('${link.reference_id}',this)">Culqi (SIMULADO)</button><button class="btn-ghost" onclick="payYape(true,this)">Yape exacto ✓</button><button class="btn-danger" onclick="payYape(false,this)">Yape falso ✗</button></div>
 <p class="muted" style="font-size:.85rem;margin-top:8px">${cfg.culqi_pk?'El pago con tarjeta crea un cargo real en Culqi sandbox y lo verifica el SERVIDOR contra la API de Culqi.':'Sin llaves CULQI_PUBLIC_KEY/SECRET_KEY no hay cargo real: el botón SIMULADO marca pagado a propósito, para demostrar la regla anti-fraude (nada avanza a cocina sin pago verificado).'}</p><div id="payerr"></div></div>`;
 const q=document.getElementById('yapeqr');
 if(window.QRCode&&cfg.yape_qr){new QRCode(q,{text:`https://yape.pe/pay/${encodeURIComponent(cfg.yape_qr)}?monto=${lastOrder.total.toFixed(2)}`,width:120,height:120,correctLevel:QRCode.CorrectLevel.M});}
 else{q.innerHTML='<div class="mono muted" style="font-size:.68rem;padding:44px 8px;text-align:center">QR no disponible<br>(sin internet)</div>';}
 add('bot',`Pedido ${lastOrder.id} por S/${lastOrder.total.toFixed(2)}. Abajo: el QR de Yape y las opciones de cobro.`);cart=[];
}
async function payCulqiReal(btn){btn.disabled=true;add('me','Pago con tarjeta');typing(true);
 try{
  if(!window.Culqi){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://checkout.culqi.com/js/v4/index.js';s.onload=res;s.onerror=()=>rej(new Error('culqi.js no cargó'));document.head.appendChild(s);setTimeout(()=>rej(new Error('culqi.js tardó demasiado')),10000);});}
  if(!window.__culqi){window.__culqi=new Culqi({publicKey:PAYCFG.culqi_pk});}
  window.__culqi.settings({title:PAYCFG.tenant||'Local',currency:'PEN',amount:Math.round(lastOrder.total*100)});
  window.culqi_token=null;window.__culqi.open();
  const tk=await new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{n++;if(window.culqi_token&&window.culqi_token.id){clearInterval(t);const tok=window.culqi_token;window.culqi_token=null;res(tok);}else if(n>200){clearInterval(t);rej(new Error('cerraste el checkout sin pagar'));}},300);});
  const r=await fetch('/api/payments/culqi/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:lastOrder.id,token:tk.id})});
  const j=await r.json();typing(false);
  if(r.ok&&j.ok){add('bot',`✅ Cargo REAL verificado por Culqi: ${j.charge_id} — ${j.motivo}. ${j.order.id} ya está en cocina.`);}
  else{add('bot','Culqi no aprobó el cargo: '+(j.motivo||j.detail||'reintenta o usa Yape.'));btn.disabled=false;}
 }catch(e){typing(false);add('bot','El checkout de Culqi no se pudo completar ('+e.message+'). Usa el cobro SIMULADO o el QR de Yape.');btn.disabled=false;}
}
async function payCulqi(ref,btn){btn.disabled=true;add('me','Pago con Culqi');typing(true);
 const r=await fetch('/api/payments/culqi/webhook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference_id:ref})});
 typing(false);if(!r.ok){btn.disabled=false;document.getElementById('payerr').innerHTML='<div class="err"><b>El cobro falló.</b> Genera el link de nuevo.</div>';return;}
 const j=await r.json();add('bot',`Pago verificado en el servidor. ${j.order.id} ya está en cocina. Míralo en Panel.`);}
async function payYape(exacto,btn){btn.disabled=true;add('me','Te mando mi voucher Yape');typing(true);
 const monto=exacto?lastOrder.total:lastOrder.total-10;
 const r=await fetch('/api/payments/yape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:lastOrder.id,monto_foto:monto})});
 typing(false);const j=await r.json();btn.disabled=false;add('bot',(j.ok?'Pago verificado. ':'Monto no coincide — posible voucher falso. ')+j.motivo+' '+(j.ok?'Ya está en cocina.':'Pide foto nítida o cobra con Culqi.'));}
add('bot','Escribe "menu" para ver la carta de '+NAMES[tenant][1]+'.');
</script></body></html>
