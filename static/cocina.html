<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cocina — Recepcionista</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="accent-bar"></div>
<header class="top"><div class="brand"><span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFF8EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-6.5 0-4-3.5-5.5-3.5-9.5-2.5 1-3.5 3-3.7 5C10.5 9.5 9 8 9 5.5 6 7.5 5 10.5 5 15.5 5 19.3 8 22 12 22Z"/></svg></span><span>Cocina</span></div>
<nav class="tabs" aria-label="Principal">
<a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M9 20v-6h6v6"/></svg><span>Locales</span></a>
<a href="/panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 9h6M3 15h6"/></svg><span>Panel</span></a>
</nav>
<span class="badge hot">solo <b>pagado verificado</b></span></header>
<div class="wrap"><h2 style="font-size:clamp(1.8rem,4vw,2.6rem)">Cola de cocina<span style="color:var(--tomate)">.</span></h2>
<p class="muted" style="font-size:.9rem;margin-top:6px">Un tap por ticket. Lo pendiente de pago ni aparece aquí.</p>
<div id="errbox" role="alert"></div>
<div class="kds-grid" id="k" style="margin-top:16px" aria-live="polite"></div></div>
<script>
const esc=s=>String(s??'').replace(/&/g,'\u0026amp;').replace(/</g,'\u0026lt;').replace(/>/g,'\u0026gt;');
const sig={};let LIST=[];
function err(msg){document.getElementById('errbox').innerHTML='<div class="err"><b>Atención.</b> '+esc(msg)+'</div>';}
function ok(){document.getElementById('errbox').innerHTML='';}
async function load(){
 let list;try{list=(await (await fetch('/api/orders')).json()).filter(o=>['confirmado','cocina'].includes(o.estado));ok();}
 catch(e){err('Sin conexión. Revisa el servidor — reintentando en 4s.');return;}
 LIST=list;
 if(!list.length){document.getElementById('k').innerHTML='<div class="empty"><b>Cola libre</b>Los pedidos pagados caen aquí solos en segundos.</div>';return;}
 const s=list.map(o=>`${o.id}|${o.estado}`).join(';');
 if(sig.v===s)return;
 sig.v=s;
 const names={};
 async function nm(tenant,id){if(!names[tenant]){names[tenant]={};try{const j=await (await fetch(`/api/menu?tenant=${tenant}`)).json();j.items.forEach(i=>names[tenant][i.id]=i.nombre);}catch(e){}}return names[tenant][id]||id;}
 let html='';
 for(const o of list){const parts=[];for(const x of o.items){parts.push(`<b class="num">${x.cant}×</b> ${esc(await nm(o.tenant,x.id))}`);}
  html+=`<article class="kds-card ticked ${o.estado==='cocina'?'late':''}">
  <div class="mono muted" style="font-size:.72rem"><span class="sdot"></span>${esc(o.tenant)} · ${esc(o.id)}</div><h3>${esc(o.cliente)}</h3>
  <div class="items">${parts.join('<br>')}</div>
  <div class="muted" style="font-size:.85rem">${esc(o.direccion)}</div>
  <div style="display:flex;gap:10px;margin-top:14px"><button onclick="tap('${o.id}','cocina',this)">En cocina</button><button class="btn-ghost" onclick="tap('${o.id}','delivery',this)">Listo ✓</button></div></article>`;}
 document.getElementById('k').innerHTML=html;
}
async function tap(id,es,btn){btn.disabled=true;
 const rr=await fetch(`/api/orders/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:es})});
 if(!rr.ok){const d=await rr.json().catch(()=>({}));err('No avanza: '+(d.detail||'error'));btn.disabled=false;}
 delete sig.v;load();}
setInterval(load,4000);load();
</script></body></html>
