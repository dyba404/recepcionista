<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carta — Recepcionista</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="accent-bar"></div>
<header class="top"><div class="brand"><span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFF8EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span><span>Carta</span></div>
<nav class="tabs" aria-label="Principal">
<a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M9 20v-6h6v6"/></svg><span>Locales</span></a>
<a href="/chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1L3 20l1-5.1A8.5 8.5 0 1 1 21 11.5Z"/></svg><span>Chat</span></a>
<a href="/panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 9h6M3 15h6"/></svg><span>Panel</span></a>
</nav>
<select id="tenant" aria-label="Local" style="max-width:170px"><option value="faro">El Faro</option><option value="brasa">Brasa Viva</option><option value="juana">Doña Juana</option></select></header>
<div class="wrap"><h2 style="font-size:clamp(1.8rem,4vw,2.6rem)">Carta viva<span style="color:var(--tomate)">.</span></h2>
<p class="muted" style="font-size:.9rem;margin-top:6px">Lo que cambias aquí lo responde el bot al instante. Nunca inventa precios.</p>
<div id="saveerr" role="alert"></div>
<div class="panel ticked" style="margin-top:16px;padding:8px;overflow:hidden"><table class="menu" id="tbl"><thead><tr><th style="width:64px"></th><th>Plato</th><th>Categoría</th><th>Precio</th><th>Disponible</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6" class="skel">cargando carta</td></tr></tbody></table></div>
<p class="mono muted" id="saved" role="status" style="font-size:.75rem;margin-top:8px"></p></div>
<script>
const esc=s=>String(s??'').replace(/&/g,'\u0026amp;').replace(/</g,'\u0026lt;').replace(/>/g,'\u0026gt;');
async function load(){
 const t=document.getElementById('tenant').value;let j;
 try{const r=await fetch(`/api/menu?tenant=${t}`);if(!r.ok)throw 0;j=await r.json();}
 catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="6"><div class="err"><b>Sin conexión.</b> Revisa el servidor.</div></td></tr>';return;}
 document.getElementById('rows').innerHTML=j.items.map(i=>`<tr><td><img class="thumb" src="${esc(i.foto||'')}" alt="" onerror="this.remove()"></td><td><b>${esc(i.nombre)}</b><br><span class="muted" style="font-size:.78rem">${esc(i.desc)}</span></td><td class="mono muted" style="font-size:.75rem">${esc(i.cat)}</td><td>S/<input class="num" value="${i.precio}" id="p-${i.id}" style="max-width:76px" inputmode="decimal" aria-label="Precio ${esc(i.nombre)}"></td><td><label class="switch"><input type="checkbox" ${i.disponible?'checked':''} id="d-${i.id}" aria-label="Disponible ${esc(i.nombre)}"><i></i></label></td><td><button style="padding:8px 12px;font-size:.8rem" onclick="save('${t}','${i.id}',this)">Guardar</button></td></tr>`).join('');
}
async function save(t,id,btn){const m=document.getElementById('saved');const e=document.getElementById('saveerr');
 e.innerHTML='';const raw=document.getElementById('p-'+id).value.replace(',','.');
 const precio=parseFloat(raw);
 if(isNaN(precio)||precio<=0||precio>9999){e.innerHTML='<div class="err"><b>Precio inválido.</b> Escribe un número entre 0 y 9999, ej 32.5.</div>';return;}
 btn.disabled=true;m.textContent='guardando…';
 try{
  const r=await fetch('/api/menu/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant:t,id,precio,disponible:document.getElementById('d-'+id).checked})});
  if(!r.ok){const d=await r.json().catch(()=>({}));e.innerHTML='<div class="err"><b>No guardó.</b> '+esc(d.detail||'error del servidor')+'</div>';m.textContent='';}
  else{m.textContent='guardado — el bot ya responde con el nuevo precio';load();}
 }catch(err2){e.innerHTML='<div class="err"><b>Sin conexión.</b> Revisa el servidor y reintenta.</div>';m.textContent='';}
 btn.disabled=false;
}
load();
document.getElementById('tenant').addEventListener('change',load);
</script></body></html>
