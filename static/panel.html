<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel — Recepcionista</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="accent-bar"></div>
<header class="top"><div class="brand"><span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFF8EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1L3 20l1-5.1A8.5 8.5 0 1 1 21 11.5Z"/></svg></span><span>Panel dueño</span></div>
<nav class="tabs" aria-label="Principal">
<a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M9 20v-6h6v6"/></svg><span>Locales</span></a>
<a href="/chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1L3 20l1-5.1A8.5 8.5 0 1 1 21 11.5Z"/></svg><span>Chat</span></a>
<a href="/panel" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 9h6M3 15h6"/></svg><span>Panel</span></a>
<a href="/cocina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-6.5 0-4-3.5-5.5-3.5-9.5-2.5 1-3.5 3-3.7 5C10.5 9.5 9 8 9 5.5 6 7.5 5 10.5 5 15.5 5 19.3 8 22 12 22Z"/></svg><span>Cocina</span></a>
<a href="/menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Carta</span></a>
</nav>
<select id="tenant" aria-label="Filtrar local" style="max-width:150px"><option value="">Todos</option><option value="faro">El Faro</option><option value="brasa">Brasa Viva</option><option value="juana">Doña Juana</option></select>
<span class="badge" id="live">en vivo · <b>4s</b></span></header>
<div class="wrap"><h2 style="font-size:clamp(1.8rem,4vw,2.6rem)">Pedidos de hoy<span style="color:var(--tomate)">.</span></h2>
<p class="muted" style="font-size:.9rem;margin-top:6px">Sin pago verificado nada avanza a cocina. Así se frena el voucher falso.</p>
<div id="errbox" role="alert"></div>
<div class="kanban" id="kb" style="margin-top:16px" aria-live="polite"></div></div>
<script>
const order=['nuevo','confirmado','cocina','delivery','entregado'];
const NEXT_LABEL={nuevo:'Confirmar',confirmado:'A cocina',cocina:'A delivery',delivery:'Entregar',entregado:'—'};
const NAMES={};
const sig={};
const esc=s=>String(s??'').replace(/&/g,'\u0026amp;').replace(/</g,'\u0026lt;').replace(/>/g,'\u0026gt;');
function err(msg){document.getElementById('errbox').innerHTML='<div class="err"><b>Atención.</b> '+esc(msg)+'</div>';}
function ok(){document.getElementById('errbox').innerHTML='';}
function shell(){document.getElementById('kb').innerHTML=order.map(es=>`<div class="col" id="col-${es}"><h4>${es} · <span class="n">…</span></h4><div class="colbody"><div class="ticket skel">cargando<br>cargando</div></div></div>`).join('');}
async function nameFor(tenant,id){if(!NAMES[tenant]){try{const j=await (await fetch(`/api/menu?tenant=${tenant}`)).json();NAMES[tenant]={};j.items.forEach(i=>NAMES[tenant][i.id]=i.nombre);}catch(e){NAMES[tenant]={};}}return (NAMES[tenant][id]||id);}
async function itemList(o){const parts=[];for(const i of o.items){parts.push(i.cant+'× '+await nameFor(o.tenant,i.id));}return parts.join(', ');}
async function ticketHTML(o){
 const desc=await itemList(o);
 return `<div class="ticket"><div class="row"><b>${esc(o.id)} · ${esc(o.cliente)}</b><span class="mono" style="font-size:.7rem">${esc(o.tenant)}</span></div><div>${esc(desc)}</div><div class="row" style="margin-top:6px"><b class="num">S/${o.total.toFixed(2)}</b><span class="pill ${o.pago.startsWith('pagado')?'ok':o.pago==='pendiente_verificar'?'warn':'bad'}">${esc(o.pago.replaceAll('_',' '))}</span></div><div class="muted" style="font-size:.75rem">${esc(o.direccion)}</div>${o.estado==='entregado'?'':`<button style="padding:7px 10px;margin-top:8px;font-size:.8rem" onclick="adv('${o.id}',this)">${NEXT_LABEL[o.estado]} →</button>`}</div>`;}
async function load(){
 const t=document.getElementById('tenant').value;const q=new URLSearchParams(location.search);const tenant=t||q.get('tenant')||'';
 let list;try{const r=await fetch('/api/orders'+(tenant?`?tenant=${tenant}`:''));if(!r.ok)throw 0;list=await r.json();ok();}
 catch(e){err('Sin conexión con el servidor — revísalo y recarga. Reintentando en 4s.');document.getElementById('live').textContent='pausado';return;}
 LIST=list;
 document.getElementById('live').textContent='en vivo · 4s';
 if(!list.length){document.getElementById('kb').innerHTML='<div class="empty"><b>Sin pedidos todavía</b>Haz un pedido desde el chat y aparece aquí en segundos.</div>';return;}
 if(!document.getElementById('col-nuevo')){Object.keys(sig).forEach(k=>delete sig[k]);shell();}
 for(const es of order){
  const items=list.filter(o=>o.estado===es);
  const s=items.map(o=>`${o.id}|${o.pago}|${o.total}|${o.items.map(i=>i.id+'x'+i.cant).join('.')}`).join(';')+(tenant?('|'+tenant):'');
  if(sig[es]===s)continue;
  sig[es]=s;
  const col=document.getElementById('col-'+es);
  const body=col.querySelector('.colbody');
  if(!items.length){col.querySelector('.n').textContent='0';body.innerHTML='<div class="muted mono" style="font-size:.72rem">—</div>';continue;}
  body.innerHTML=(await Promise.all(items.map(ticketHTML))).join('');
  col.querySelector('.n').textContent=items.length;
 }
}
let LIST=[];
async function adv(id,btn){const o=LIST.find(x=>x.id===id);if(!o)return;
 const next=order[Math.min(order.indexOf(o.estado)+1,order.length-1)];
 if(next===o.estado)return;
 btn.disabled=true;btn.textContent='…';
 const rr=await fetch(`/api/orders/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:next})});
 if(!rr.ok){const d=await rr.json().catch(()=>({}));err('No avanza: '+(d.detail||'error')+'. Cobra o verifica el pago primero.');}
 load();}
document.getElementById('tenant').addEventListener('change',()=>{Object.keys(sig).forEach(k=>delete sig[k]);load();});
shell();setInterval(load,4000);load();
</script></body></html>
